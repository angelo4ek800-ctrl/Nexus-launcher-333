name: Build NEXUS Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Join, decode and extract source bundle
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'NexusLauncher_source_*.b64' | Sort-Object Name)
          if ($parts.Count -ne 9) { throw "Expected 9 source parts, found $($parts.Count)." }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            $piece = (Get-Content -Raw -LiteralPath $part.FullName).Trim()
            if ($piece -notmatch '^[A-Za-z0-9+/]+={0,2}$') { throw "Invalid base64 characters in $($part.Name)." }
            [void]$builder.Append($piece)
          }
          $encoded = $builder.ToString()
          if (($encoded.Length % 4) -ne 0) { throw "Invalid base64 length: $($encoded.Length)." }
          $archive = Join-Path $env:GITHUB_WORKSPACE 'NexusLauncher_0.5.1_Source.tar.bz2'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          python -c "import tarfile; tarfile.open(r'$archive', 'r:bz2').extractall(r'$env:GITHUB_WORKSPACE', filter='data')"
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'NexusLauncher/NexusLauncher.csproj'))) {
            throw 'NexusLauncher project was not found after extracting the source archive.'
          }
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'NexusLauncher/build-installer.ps1'
          $buildText = [IO.File]::ReadAllText($buildScript)
          $buildText = $buildText.Replace('$env:ProgramFiles(x86)', '${env:ProgramFiles(x86)}')
          [IO.File]::WriteAllText($buildScript, $buildText, [Text.UTF8Encoding]::new($false))

      - name: Apply samurai theme, offline login and uninstall cleanup
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'NexusUI_patch_*.b64' | Sort-Object Name)
          if ($parts.Count -ne 19) { throw "Expected 19 patch parts, found $($parts.Count)." }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            $piece = (Get-Content -Raw -LiteralPath $part.FullName).Trim()
            [void]$builder.Append($piece)
          }
          $encoded = $builder.ToString()
          if (($encoded.Length % 4) -ne 0) { throw "Invalid patch base64 length." }
          $patchArchive = Join-Path $env:GITHUB_WORKSPACE 'NexusSamurai.patch.tar.bz2'
          [IO.File]::WriteAllBytes($patchArchive, [Convert]::FromBase64String($encoded))
          python -c "import tarfile; tarfile.open(r'$patchArchive', 'r:bz2').extractall(r'$env:GITHUB_WORKSPACE', filter='data')"
          python -c 'from pathlib import Path; p=Path("NexusLauncher/MainWindow.xaml.cs"); s=p.read_text(encoding="utf-8"); old="            MessageBox.Show("+chr(10)+"                "+chr(34)+"Помести полный набор DLL"; new="            if (MessageBox.Show("+chr(10)+"                "+chr(34)+"Помести полный набор DLL"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          if ((Select-String -Path 'NexusLauncher/MainWindow.xaml' -Pattern 'LetterSpacing' -Quiet)) {
            throw 'Unsupported WPF LetterSpacing property remains in MainWindow.xaml.'
          }

      - name: Apply built-in performance optimization
        shell: pwsh
        run: |
          $service = @'
          using System.Text;
          namespace NexusLauncher.Services;
          public static class PerformanceOptimizationService
          {
              private const string MarkerName = ".nexus-performance-v1";
              public static void ApplyFirstRunPreset(string gameDirectory, IProgress<string>? progress = null)
              {
                  Directory.CreateDirectory(gameDirectory);
                  var marker = Path.Combine(gameDirectory, MarkerName);
                  if (File.Exists(marker)) return;
                  var optionsPath = Path.Combine(gameDirectory, "options.txt");
                  var lines = File.Exists(optionsPath) ? File.ReadAllLines(optionsPath, Encoding.UTF8).ToList() : new List<string>();
                  var defaults = new Dictionary<string, string>(StringComparer.Ordinal)
                  {
                      ["renderDistance"] = "8", ["simulationDistance"] = "5", ["graphicsMode"] = "0",
                      ["particles"] = "1", ["entityShadows"] = "false", ["entityDistanceScaling"] = "0.75",
                      ["biomeBlendRadius"] = "0", ["mipmapLevels"] = "0", ["maxFps"] = "260",
                      ["enableVsync"] = "false", ["ao"] = "0", ["cloudStatus"] = "0"
                  };
                  var present = new HashSet<string>(lines.Select(line => line.Split(':', 2)[0]), StringComparer.Ordinal);
                  foreach (var pair in defaults) if (!present.Contains(pair.Key)) lines.Add(pair.Key + ":" + pair.Value);
                  File.WriteAllLines(optionsPath, lines, new UTF8Encoding(false));
                  File.WriteAllText(marker, "NEXUS performance preset v1" + Environment.NewLine, Encoding.UTF8);
                  progress?.Report("Встроенная оптимизация NEXUS: применены безопасные настройки графики; существующие параметры не перезаписаны.");
              }
              public static IReadOnlyList<string> GetJvmArguments() => new[]
              {
                  "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=100", "-XX:G1ReservePercent=20",
                  "-XX:InitiatingHeapOccupancyPercent=15", "-XX:+ParallelRefProcEnabled",
                  "-XX:+DisableExplicitGC", "-XX:+UseStringDeduplication"
              };
          }
          '@
          Set-Content -LiteralPath 'NexusLauncher/Services/PerformanceOptimizationService.cs' -Value $service -Encoding utf8
          $launchPath = 'NexusLauncher/Services/MinecraftLaunchService.cs'
          $launch = [IO.File]::ReadAllText($launchPath)
          $oldLine = '        start.ArgumentList.Add("-Xmx" + memoryMb + "M");'
          $newLines = $oldLine + [Environment]::NewLine + '        foreach (var optimizationArgument in PerformanceOptimizationService.GetJvmArguments())' + [Environment]::NewLine + '            start.ArgumentList.Add(optimizationArgument);'
          if (-not $launch.Contains($oldLine)) { throw 'Could not locate JVM argument insertion point.' }
          $launch = $launch.Replace($oldLine, $newLines)
          [IO.File]::WriteAllText($launchPath, $launch, [Text.UTF8Encoding]::new($false))
          $mainPath = 'NexusLauncher/MainWindow.xaml.cs'
          $main = [IO.File]::ReadAllText($mainPath)
          $oldLaunch = '            await _runtime.InstallAsync(Current.GameDirectory, targetVersion, progress, OperationToken);'
          $newLaunch = '            PerformanceOptimizationService.ApplyFirstRunPreset(Current.GameDirectory, progress);' + [Environment]::NewLine + $oldLaunch
          if (-not $main.Contains($oldLaunch)) { throw 'Could not locate Minecraft launch insertion point.' }
          $main = $main.Replace($oldLaunch, $newLaunch)
          [IO.File]::WriteAllText($mainPath, $main, [Text.UTF8Encoding]::new($false))
      - name: Add searchable Minecraft version picker
        shell: pwsh
        run: |
          python 'build/apply_version_picker.py'
          if (-not (Test-Path 'NexusLauncher/MinecraftVersionPickerWindow.cs')) { throw 'Version picker source was not created.' }
          if (-not (Select-String -Path 'NexusLauncher/MainWindow.xaml' -Pattern 'VersionPicker_Click' -Quiet)) { throw 'Version picker button was not connected.' }
      - name: Prevent concurrent library writes and duplicate launches
        shell: pwsh
        run: |
          python 'build/apply_download_lock.py'
          if (-not (Select-String -Path 'NexusLauncher/Services/MinecraftRuntimeService.cs' -Pattern 'LibraryDownloadLocks' -Quiet)) { throw 'Library download lock was not applied.' }
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate source
        shell: pwsh
        working-directory: NexusLauncher
        run: python tools/validate-project.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $iscc = @(
            "$programFilesX86\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = "$programFilesX86\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 compiler was not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish app and compile installer
        shell: pwsh
        working-directory: NexusLauncher
        run: ./build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncherSetup-Windows-x64
          path: NexusLauncher/dist/installer/NexusLauncherSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NexusLauncher/dist/installer/NexusLauncherSetup.exe
          generate_release_notes: true
